<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dillan · Offline</title>
<link rel="stylesheet" href="/tokens.css" />
<style>
  @font-face { font-family: "Satoshi"; src: url("/fonts/Satoshi-Variable.woff2") format("woff2"); font-weight: 300 900; }
  @font-face { font-family: "Newsreader"; src: url("/fonts/Newsreader-Variable.woff2") format("woff2"); }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); font-family: var(--font-ui); display: grid; place-items: center; padding: var(--margin); box-sizing: border-box; }
  main { max-width: 28rem; }
  h1 { font-family: var(--font-voice); font-weight: 400; font-size: var(--t-voice-xl); line-height: 1.2; margin: 0 0 var(--s3); }
  p { color: var(--text-2); font-size: var(--t-body); line-height: 1.45; }
  button { margin-top: var(--s5); height: 58px; width: 100%; border: 0; border-radius: var(--r-btn); background: var(--surface-2); color: var(--text); font: 600 var(--t-headline) var(--font-ui); }
  svg { display: block; margin-bottom: var(--s5); color: var(--text); }
  .foot { margin-top: var(--s4); font-size: var(--t-footnote); text-align: center; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 64 64" width="56" height="56" aria-label="Dillan" role="img"><path d="M13 31a19 19 0 0 0 38 0" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><circle cx="32" cy="27" r="7.5" fill="var(--spot)"/></svg>
  <h1>Dillan needs a connection the first time.</h1>
  <p>After Dillan loads once on this device, your plan, set logging and rest timers keep working without a connection. Sets you log offline sync when you're back.</p>
  <button onclick="location.reload()">Try again</button>
  <p class="foot">Nothing was lost. There's nothing saved here yet.</p>
</main>
</body>
</html>
